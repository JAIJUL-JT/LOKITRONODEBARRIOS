name: Deploy to Vercel

on:
    push:
        branches: [main, master]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v20
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: team_ayVS03M2PCvDp9RJE1F8faKV
                  vercel-project-id: prj_Hs3KRO8qaFntAhqG1gTrQxYOPAw1
                  working-directory: .
                  vercel-args: --yes
                  target: production