name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ayVS03M2PCvDp9RJE1F8faKV
          VERCEL_PROJECT_ID: prj_Hs3KRO8qaFntAhqG1gTrQxYOPAw1
        run: npx vercel@latest --prod --yes --token "$VERCEL_TOKEN"
